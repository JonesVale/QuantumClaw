# Render Blueprint for QuantumClaw
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: quantumclaw
    env: docker
    repo: https://github.com/QuantumClaw/QuantumClaw
    plan: starter
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_TYPE
        value: master
      - key: SQL_DSN
        fromDatabase:
          name: quantumclaw-db
          property: connectionString
      - key: REDIS_CONN_STRING
        fromService:
          name: quantumclaw-redis
          type: redis
          property: connectionString

databases:
  - name: quantumclaw-db
    plan: starter
    databaseName: quantumclaw
    user: quantumclaw

redis:
  - name: quantumclaw-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
