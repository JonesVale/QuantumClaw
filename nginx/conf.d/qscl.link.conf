# ============================================================
# QuantumClaw — Nginx SSL Configuration
# Domain: qscl.link
# ============================================================
# 使用说明：
# 1. 先将域名 qscl.link 的 DNS A 记录指向服务器公网 IP
# 2. 执行 deploy/setup-ssl.sh 获取 Let's Encrypt SSL 证书
# 3. docker compose up -d 重新部署
# ============================================================

server {
    listen 80;
    server_name qscl.link www.qscl.link;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name qscl.link www.qscl.link;

    # ── SSL ──
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

    # ── Modern SSL config (Mozilla Intermediate) ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── HSTS (1 year) ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Security Headers ──
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Proxy to QuantumClaw App ──
    location / {
        proxy_pass http://quantumclaw:3666;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Static assets (cache aggressively) ──
    location /assets/ {
        proxy_pass http://quantumclaw:3666;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Let's Encrypt verification ──
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Deny access to sensitive paths ──
    location ~ /\.(?!well-known) {
        deny all;
    }
}
